services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Sa1234!@#"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  catalog-service:
    build:
      context: ..
      dockerfile: services/catalog/src/catalogservice.api/Dockerfile
    container_name: catalog-service
    ports:
      - "5001:8080"
    depends_on:
      - sqlserver
